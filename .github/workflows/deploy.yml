name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
      - devin/1762614199-sapporo-mvp
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      NEXT_PUBLIC_BASE_PATH: /sapporo-inbound-map
      NEXT_PUBLIC_MAP_PROVIDER: ${{ secrets.NEXT_PUBLIC_MAP_PROVIDER }}
      NEXT_PUBLIC_GMAPS_API_KEY: ${{ secrets.NEXT_PUBLIC_GMAPS_API_KEY }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Debug environment
        run: echo "Map Provider=$NEXT_PUBLIC_MAP_PROVIDER"

      - name: Build with Next.js
        env:
          NODE_ENV: production
        run: npm run build

      - name: Add .nojekyll file
        run: touch out/.nojekyll

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./out

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
